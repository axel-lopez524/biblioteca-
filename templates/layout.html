<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} | Biblioteca Universitaria UDL-ICO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
        integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark">
        <a class="navbar-brand" href="{{ url_for('inicio') }}">Biblioteca UDL-ICO</a>
        <ul class="navbar-nav">
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'inicio' %}active{% endif %}"
                    href="{{ url_for('inicio') }}">Inicio</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'catalogo' %}active{% endif %}"
                    href="{{ url_for('catalogo') }}">Catálogo</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'servicios' %}active{% endif %}"
                    href="{{ url_for('servicios') }}">Servicios</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if active_page == 'contacto' %}active{% endif %}"
                    href="{{ url_for('contacto') }}">Contacto</a>
            </li>
        </ul>
    </nav>

    {% block content %}
    {% endblock %}
</body>

</html>
